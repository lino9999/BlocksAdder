name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BlocksAdder-java-${{ matrix.java }}
          path: target/BlocksAdder-*.jar
          if-no-files-found: error
